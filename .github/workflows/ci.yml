name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: uv sync --frozen

      - name: Ruff Lint
        run: uv run ruff check src

      - name: Ruff Format
        run: uv run ruff format --check src

      - name: Pyright
        run: uv run pyright

      - name: Test
        run: uv run pytest
