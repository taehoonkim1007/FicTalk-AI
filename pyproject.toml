[project]
name = "fictalk-ai"
version = "0.1.0"
description = "AI service for FicTalk - Character conversation with RAG"
authors = [
    { name = "taehoonkim1007", email = "dsst1007@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    # FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "python-multipart>=0.0.9",
    # OpenAI & LLMs
    "openai>=1.51.0",
    "langchain>=0.3.7",
    "langchain-openai>=0.2.1",
    "langchain-google-genai>=2.0.8",
    "langchain-community>=0.3.1",
    "langgraph>=0.2.0",
    "google-generativeai>=0.8.3",
    "google-genai>=1.0.0",  # Imagen 3 image generation
    # Database (PostgreSQL + pgvector)
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.4",
    # Audio & TTS
    "elevenlabs>=1.50.0",
    # HTTP Client
    "httpx>=0.27.2",
    # Configuration
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.5.2",
    # Utilities
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Ruff Configuration
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "TC001",  # move application import into type-checking block (too aggressive)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Pyright Configuration
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["**/__pycache__", ".venv", "venv"]
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false
reportPrivateImportUsage = false

# Pytest Configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: 통합 테스트 (DB, API 필요)",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]
